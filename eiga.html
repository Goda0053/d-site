<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>映画『ディメンション・ゲート』公式ファンコメント広場</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans JP', 'M PLUS Rounded 1c', sans-serif;
      background-color: #0d0f17;
      color: #e2e8f0;
      overflow-x: hidden;
    }

    /* 吹き出しの三角しっぽスタイル (コメント用) */
    .bubble-tail-bottom::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 28px;
      border-width: 10px 10px 0;
      border-style: solid;
      border-color: #1e293b transparent transparent transparent;
      display: block;
      width: 0;
    }

    /* 上部「ポップアップを消去しました」吹き出しのしっぽ（上向き） */
    .bubble-tail-top::before {
      content: '';
      position: absolute;
      top: -10px;
      left: 36px;
      border-width: 0 10px 10px;
      border-style: solid;
      border-color: transparent transparent #065f46 transparent;
      display: block;
      width: 0;
    }

    /* グローエフェクト */
    .glow-ad {
      box-shadow: 0 4px 25px rgba(244, 63, 94, 0.45), 0 0 15px rgba(236, 72, 153, 0.3);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-white">

  <!-- ============================================================= -->
  <!-- サイト上部に常に表示されるポップアップ広告エリア -->
  <!-- ============================================================= -->
  <div id="topAdBanner" class="sticky top-0 z-50 w-full bg-gradient-to-r from-slate-950 via-rose-950 to-purple-950 border-b-2 border-rose-500 glow-ad px-4 py-3 sm:py-3.5 shadow-2xl transition-all duration-300">
    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-left">
      <div class="flex items-center gap-3">
        <span class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-500 to-pink-500 flex items-center justify-center text-white text-lg shadow-md flex-shrink-0 animate-pulse">
          <i class="fa-solid fa-heart"></i>
        </span>
        <div>
          <div class="inline-block bg-rose-600 text-white text-[10px] font-black px-2 py-0.5 rounded uppercase tracking-wider mb-0.5">
            Advertisement
          </div>
          <div class="text-white text-sm sm:text-base font-black tracking-wide leading-tight">
            「最高のトキメキ映画体験を！ 詳しくはWEBで！」
          </div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="window.open('#', '_blank')" class="px-4 py-1.5 bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-400 hover:to-pink-500 text-white text-xs font-bold rounded-lg shadow transition whitespace-nowrap">
          詳しくはWEBで <i class="fa-solid fa-arrow-up-right-from-square ml-1"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- ============================================================= -->
  <!-- ポップアップ消去後に上部に表示される吹き出し通知 -->
  <!-- ============================================================= -->
  <div id="clearedBubbleContainer" class="hidden sticky top-0 z-50 w-full bg-slate-900/95 backdrop-blur-md border-b border-emerald-500/50 py-3 px-4 shadow-lg">
    <div class="max-w-4xl mx-auto flex items-center justify-start">
      <!-- 吹き出し本体 -->
      <div class="relative bg-emerald-900 border border-emerald-500 text-emerald-100 px-5 py-2.5 rounded-2xl shadow-md bubble-tail-top flex items-center">
        <span class="text-sm font-bold tracking-wide">
          ポップアップを消去しました
        </span>
      </div>
    </div>
  </div>

  <!-- ナビゲーションヘッダー -->
  <header class="bg-slate-900/80 backdrop-blur-sm border-b border-slate-800">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white text-sm shadow">
          <i class="fa-solid fa-film"></i>
        </span>
        <h1 class="text-base sm:text-lg font-bold tracking-tight text-white">
          ディメンション・シネマ <span class="text-xs text-indigo-400 font-normal">観客コメント広場</span>
        </h1>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-3xl mx-auto px-4 py-8 flex-grow w-full">

    <!-- 作品情報ヘッダー -->
    <div class="rounded-2xl bg-gradient-to-r from-slate-900 to-indigo-950 border border-slate-800 p-5 sm:p-6 mb-8 text-center sm:text-left flex flex-col sm:flex-row items-center gap-5">
      <div class="w-20 h-28 rounded-xl bg-slate-950 border border-slate-700 flex flex-col items-center justify-center text-rose-400 shadow-md flex-shrink-0">
        <i class="fa-solid fa-clapperboard text-2xl mb-1"></i>
        <span class="text-[10px] font-bold text-slate-400">公開中</span>
      </div>
      <div>
        <div class="inline-block px-2.5 py-0.5 rounded-full bg-rose-500/10 text-rose-400 border border-rose-500/20 text-[11px] font-semibold mb-1.5">
          上映時間 60分
        </div>
        <h2 class="text-xl sm:text-2xl font-black text-white">映画『ディメンション・コール』</h2>
        <p class="text-xs sm:text-sm text-slate-400 mt-1">
          劇場で本作を鑑賞されたお客様からのリアルな声をお届けします。
        </p>
      </div>
    </div>

    <!-- コメント吹き出し一覧（1列のみのシングルカラムレイアウト） -->
    <div class="mb-12">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-6">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-comments text-indigo-400"></i> 観客の吹き出しコメント
        </h3>
        <span class="text-xs text-slate-400">全8件（縦1列表示）</span>
      </div>

      <!-- 吹き出しコンテナ（w-full / 1列レイアウト） -->
      <div id="commentsColumn" class="flex flex-col space-y-6 w-full">
        <!-- JSで1列ずつ順番に描画されます -->
      </div>
    </div>

  </main>

  <!-- フッター -->
  <footer class="border-t border-slate-800/80 bg-slate-950 py-6 text-center text-xs text-slate-500">
    <p>© 2026 Dimension Cinema Network. All rights reserved.</p>
  </footer>

  <!-- ============================================================= -->
  <!-- 右下チャット通知ウィジェット (フラグが true の時のみ表示) -->
  <!-- ============================================================= -->
  <div id="bottomChatWidget" class="hidden fixed bottom-6 right-6 z-50 flex items-end gap-3 max-w-sm animate-bounce-short">
    <!-- チャット吹き出し本体 -->
    <div class="relative bg-slate-900/95 border border-indigo-500/80 text-white px-4 py-3 rounded-2xl shadow-2xl backdrop-blur-md flex items-center gap-3">
      <!-- 送信者アバター（マル） -->
      <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-white font-bold text-xs shadow-md flex-shrink-0">
        マル
      </div>
      <!-- メッセージ内容 -->
      <div class="flex flex-col">
        <span class="text-xs font-bold text-indigo-300">マル</span>
        <span class="text-sm font-semibold text-slate-100">ちょっといいですか？「できました」と送ってほしいです。</span>
      </div>
      <!-- 右下のしっぽ -->
      <div class="absolute -bottom-2 right-6 w-0 h-0 border-x-8 border-x-transparent border-t-8 border-t-slate-900"></div>
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    // 指定された8件のコメント一覧
    const commentsList = [
      { text: "すごいよかった！", author: "ナナ", time: "10分前", rating: 5, icon: "fa-star" },
      { text: "たくさん泣いた！", author: "ケイタ", time: "25分前", rating: 5, icon: "fa-heart" },
      { text: "ーーー！声も出ない！", author: "M・S", time: "42分前", rating: 5, icon: "fa-bolt" },
      { text: "でんわを取るシーン、よかったなぁ", author: "シネマ好き", time: "1時間前", rating: 5, icon: "fa-phone" },
      { text: "謎が謎を呼ぶ展開！", author: "タカシ", time: "1時間前", rating: 4, icon: "fa-magnifying-glass" },
      { text: "１時間とは思えない濃密さ！", author: "映画ライター", time: "2時間前", rating: 5, icon: "fa-clock" },
      { text: "とりあえず、これを見たほうがいい！", author: "ハルカ", time: "3時間前", rating: 5, icon: "fa-thumbs-up" },
      { text: "けっさくです。とにかく。", author: "リョウ", time: "3時間前", rating: 5, icon: "fa-award" }
    ];

    // 吹き出しを1列ずつ描画
    function renderComments() {
      const container = document.getElementById('commentsColumn');
      container.innerHTML = '';

      commentsList.forEach((item, index) => {
        const itemWrapper = document.createElement('div');
        itemWrapper.className = 'w-full flex flex-col items-start';

        itemWrapper.innerHTML = `
          <!-- 吹き出しカード (1列全幅) -->
          <div class="relative w-full bg-slate-800/90 border border-slate-700 rounded-2xl p-4 sm:p-5 shadow-lg mb-3 bubble-tail-bottom transition hover:border-indigo-500/60 hover:bg-slate-800">
            <div class="flex items-center justify-between text-yellow-400 text-xs mb-2">
              <span class="font-bold flex items-center gap-1">
                ${'<i class="fa-solid fa-star"></i>'.repeat(item.rating)}
              </span>
              <span class="text-[11px] text-slate-400">コメント #${index + 1}</span>
            </div>
            <!-- 指定コメント本文 -->
            <p class="text-base sm:text-lg font-extrabold text-white tracking-wide">
              「${item.text}」
            </p>
          </div>

          <!-- 投稿者アバター & メタ情報 -->
          <div class="flex items-center gap-2 pl-3">
            <div class="w-6 h-6 rounded-full bg-slate-700 text-indigo-300 flex items-center justify-center text-[10px]">
              <i class="fa-solid ${item.icon}"></i>
            </div>
            <span class="text-xs font-semibold text-slate-300">${item.author}</span>
            <span class="text-[11px] text-slate-500">• ${item.time}</span>
          </div>
        `;
        container.appendChild(itemWrapper);
      });
    }

    // ==========================================
    // LocalStorage (tokimeki_flag) 制御ロジック
    // ==========================================
    const STORAGE_KEY = 'tokimeki_flag';
    const ALT_STORAGE_KEY = 'tokumei_flag';

    // フラグを判定して画面上部のポップアップ/吹き出し/右下チャットを切り替え
    function checkTokimekiFlag() {
      // tokimeki_flag または tokumei_flag のいずれかが true か判定
      const flag1 = localStorage.getItem(STORAGE_KEY);
      const flag2 = localStorage.getItem(ALT_STORAGE_KEY);
      const isFlagTrue = (flag1 === 'true' || flag1 === true || flag2 === 'true' || flag2 === true);
      
      const topAdBanner = document.getElementById('topAdBanner');
      const clearedBubble = document.getElementById('clearedBubbleContainer');
      const bottomChatWidget = document.getElementById('bottomChatWidget');

      // フラグが true の場合
      if (isFlagTrue) {
        // 上部の広告ポップアップを非表示
        if (topAdBanner) topAdBanner.classList.add('hidden');
        // 上部に「ポップアップを消去しました」吹き出しを表示
        if (clearedBubble) clearedBubble.classList.remove('hidden');
        // 右下に「マル：ちょっといいですか？」チャットを表示
        if (bottomChatWidget) bottomChatWidget.classList.remove('hidden');
      } else {
        // 未入力時は上部に広告ポップアップを常に表示
        if (topAdBanner) topAdBanner.classList.remove('hidden');
        if (clearedBubble) clearedBubble.classList.add('hidden');
        if (bottomChatWidget) bottomChatWidget.classList.add('hidden');
      }
    }

    // 他タブでの変更もリアルタイム反映
    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY || e.key === ALT_STORAGE_KEY) {
        checkTokimekiFlag();
      }
    });

    // 初期化処理
    window.onload = function () {
      renderComments();
      checkTokimekiFlag();
    };
  </script>
</body>
</html>
